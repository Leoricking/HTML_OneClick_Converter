<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTML 一鍵轉換器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="logo">H</div>
      <div>
        <h1>HTML 一鍵轉換器</h1>
        <p>Opera・Edge・Chrome</p>
      </div>
    </header>

    <section class="group clipper-group">
      <h2>網頁剪藏</h2>

      <label class="field">
        <span>剪藏標題</span>
        <input id="clip-title" type="text" maxlength="150" placeholder="自動使用目前網頁標題">
      </label>

      <label class="field">
        <span>剪藏格式</span>
        <select id="clip-mode">
          <option value="article">整篇文章 HTML（保留排版）</option>
          <option value="simplified">簡化文章 HTML（閱讀模式）</option>
          <option value="full-mhtml">完整頁面 MHTML（含頁面資源）</option>
          <option value="full-html">完整頁面 HTML 快照</option>
          <option value="bookmark">書籤卡片 HTML</option>
          <option value="element">手動點選網頁元素 HTML</option>
          <option value="region">拖曳選取區域截圖</option>
        </select>
        <small id="clip-mode-help" class="field-help"></small>
      </label>

      <label class="field">
        <span>輸出目標</span>
        <select id="clip-target">
          <option value="both" selected>下載＋傳送到 OneNote</option>
          <option value="onenote">只傳送到 OneNote</option>
          <option value="download">只下載到電腦</option>
        </select>
      </label>

      <div id="onenote-settings">
        <label class="field">
          <span>OneNote 傳送方式</span>
          <select id="onenote-mode">
            <option value="clipboard" selected>複製後貼上（免登入）</option>
            <option value="direct">直接建立頁面（Microsoft 登入）</option>
          </select>
          <small id="onenote-mode-help" class="field-help"></small>
        </label>

        <div id="onenote-direct-panel" class="direct-panel hidden">
          <label class="field">
            <span>Microsoft Entra 應用程式 Client ID</span>
            <input id="onenote-client-id" type="text" inputmode="text" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
          </label>
          <label class="field">
            <span>Redirect URI（請加入 Entra 的 SPA Redirect URI）</span>
            <div class="inline-field">
              <input id="onenote-redirect-uri" type="text" readonly>
              <button id="copy-redirect-uri" type="button" class="compact">複製</button>
            </div>
          </label>
          <div class="button-row">
            <button id="onenote-sign-in" type="button"><span>登入 Microsoft</span></button>
            <button id="onenote-refresh" type="button"><span>重新整理</span></button>
            <button id="onenote-sign-out" type="button"><span>登出</span></button>
          </div>
          <p id="onenote-auth-status" class="auth-status">尚未登入。</p>
          <label class="field">
            <span>OneNote 筆記本</span>
            <select id="onenote-notebook"><option value="">請先登入 Microsoft</option></select>
          </label>
          <label class="field">
            <span>OneNote 節區</span>
            <select id="onenote-section"><option value="">請先選擇筆記本</option></select>
          </label>
          <small class="field-help">第一次使用請依 README 完成一次 Microsoft Entra 設定；不需要 Client Secret。</small>
        </div>
      </div>

      <div class="field-grid">
        <label class="field">
          <span>下載分類</span>
          <input id="clip-notebook" type="text" maxlength="80" placeholder="未分類">
        </label>
        <label class="field">
          <span>標籤</span>
          <input id="clip-tags" type="text" maxlength="300" placeholder="跑步, 賽事, 待確認">
        </label>
      </div>

      <label class="field">
        <span>備註</span>
        <textarea id="clip-note" rows="2" maxlength="2000" placeholder="加入這次剪藏的備註（可留空）"></textarea>
      </label>

      <div class="clip-actions">
        <button id="preview-web-clip" type="button">
          <span>預覽剪藏效果</span>
          <small>在原網頁標示本次會擷取的範圍</small>
        </button>
        <button id="save-web-clip" class="clip-primary">
          <span>開始剪藏</span>
          <small>依照上方設定處理目前網頁</small>
        </button>
      </div>
      <p class="privacy-note">剪貼簿模式只在本機處理；直接建立頁面模式只將本次剪藏內容傳送至 Microsoft Graph／OneNote。</p>
    </section>

    <section class="group">
      <h2>轉為圖片</h2>

      <label class="field">
        <span>圖片格式</span>
        <select id="image-format">
          <option value="png" selected>PNG（較清晰、適合保存）</option>
          <option value="jpg">JPG（體積較小）</option>
        </select>
      </label>

      <button id="capture-visible" class="primary">
        <span>擷取目前畫面</span>
        <small>依所選格式儲存目前可見範圍</small>
      </button>
      <button id="capture-full">
        <span>擷取完整網頁</span>
        <small>自動捲動並拼接成整頁長圖（PNG / JPG）</small>
      </button>

      <div class="capture-feedback" aria-label="完整頁面下載狀態">
        <div id="progress" class="progress hidden">
          <div class="progress-track"><div id="progress-bar"></div></div>
          <span id="progress-text">處理中…</span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="group">
      <h2>轉為 PDF</h2>
      <button id="save-page-pdf">
        <span>另存目前網頁 PDF</span>
        <small>開啟列印視窗，目的地選擇「另存為 PDF」</small>
      </button>
    </section>

    <section class="group">
      <h2>轉為純文字</h2>
      <button id="save-main-text">
        <span>下載主要內容 TXT</span>
        <small>優先擷取文章／主內容，減少選單雜訊</small>
      </button>
      <button id="save-all-text">
        <span>下載全部文字 TXT</span>
        <small>完整保留頁面可見文字</small>
      </button>
      <button id="copy-main-text">
        <span>複製主要內容</span>
        <small>直接貼到 ChatGPT、記事本或文件</small>
      </button>
      <button id="copy-onenote-text">
        <span>複製到 OneNote（20pt）</span>
        <small>貼到 OneNote 會保留 20pt 字體大小</small>
      </button>
    </section>

    <label class="option">
      <input id="include-meta" type="checkbox" checked>
      <span>TXT 加入標題、網址與擷取時間</span>
    </label>

  </main>
  <script src="onenote.js"></script>
  <script src="popup.js"></script>
</body>
</html>
